name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the full Playwright suite on the self-hosted macOS runner (needs DSH + a configured profile)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit / build / UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The full suite needs a real DSH host with a workspace/session (for the
  # composer capsule) and a pre-authenticated profile. GitHub-hosted runners
  # start from an empty DSH_HOME and require a one-time token that cannot be
  # passed to the browser reliably, so this job runs on a self-hosted runner:
  # labels [self-hosted, macOS, dsh-profile], with `dsh` on PATH and a working
  # web profile. Trigger it via "Run workflow" with run_e2e=true.
  e2e:
    name: Playwright E2E (self-hosted, configured DSH profile)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: [self-hosted, macOS, dsh-profile]
    timeout-minutes: 30
    env:
      DSH_E2E_BROWSER: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install webkit
      - name: Run the full E2E suite (capsule included)
        run: npm run test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/.artifacts
          if-no-files-found: ignore
          # 目录名以 . 开头：upload-artifact 默认不收集隐藏文件，必须显式开启。
          include-hidden-files: true
