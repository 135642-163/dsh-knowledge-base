# dsh-knowledge-wiki bundle patch.
#
# Installed as a profile bundle (market / `dsh plugin add github:...`), this
# file mounts the plugin. Users can override any config key in their profile's
# cordis.patch.yml, but must NOT add a second `insert` with id `knowledge-wiki`
# (duplicate loader ids fail the boot). If you migrate from the old
# install-to-machine.sh setup, remove its insert row first.
- insert:
    - id: knowledge-wiki
      name: dsh-knowledge-wiki
      config:
        kbRoot: ~/.dsh/knowledge
        defaultKb: default
        autoDownloadModels: true
