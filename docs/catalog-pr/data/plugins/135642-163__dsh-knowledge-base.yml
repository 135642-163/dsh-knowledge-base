description:
  en: 'Local-first knowledge base for DeepSeek Harness: imports Word/PPT/Excel/PDF (text or scanned), EPUB and MOBI/AZW3, builds Markdown parts with page anchors, OCR quality/confidence and column-aware PDF reading order, and supports ranked search, cross-KB query, precise reading/editing, and md/jsonl/zip export.'
  zh: 'DeepSeek Harness 本地知识库：导入 Word/PPT/Excel/PDF（文字版或扫描版）、EPUB、MOBI/AZW3，生成带页码锚点、OCR 质量/置信度与 PDF 双栏阅读顺序的 Markdown 分块，支持排序检索、跨库查询、精读修订与 md/jsonl/zip 导出。'
